version = "0.1.0"
description = "Codexy-owned language server catalog for validation and future runtime wiring. Entries do not claim local installation."

servers = [
  { id = "astro", language = "Astro", extensions = [".astro"], command = ["astro-ls"], priority = 80, install = "npm install -g @astrojs/language-server" },
  { id = "basedpyright", language = "Python", extensions = [".py",".pyi"], command = ["basedpyright-langserver","--stdio"], priority = 80, install = "npm install -g basedpyright" },
  { id = "bash-language-server", language = "Shell", extensions = [".sh",".bash",".zsh",".ksh"], command = ["bash-language-server","start"], priority = 80, install = "npm install -g bash-language-server" },
  { id = "clangd", language = "C/C++", extensions = [".c",".cc",".cpp",".cxx",".h",".hh",".hpp",".hxx"], command = ["clangd"], priority = 80, install = "Install clangd from LLVM or a system package manager." },
  { id = "clojure-lsp", language = "Clojure", extensions = [".clj",".cljs",".cljc",".edn"], command = ["clojure-lsp"], priority = 80, install = "Install clojure-lsp." },
  { id = "css-language-server", language = "CSS", extensions = [".css",".scss",".less"], command = ["vscode-css-language-server","--stdio"], priority = 80, install = "npm install -g vscode-langservers-extracted" },
  { id = "docker-language-server", language = "Dockerfile", extensions = [".dockerfile","Dockerfile"], command = ["docker-langserver","--stdio"], priority = 80, install = "npm install -g dockerfile-language-server-nodejs" },
  { id = "elixir-ls", language = "Elixir", extensions = [".ex",".exs"], command = ["elixir-ls"], priority = 80, install = "Install ElixirLS for the target project." },
  { id = "emmet-language-server", language = "Emmet", extensions = [".html",".htm",".css",".scss",".less",".jsx",".tsx",".vue",".svelte",".astro"], command = ["emmet-language-server","--stdio"], priority = 40, install = "npm install -g @olrtg/emmet-language-server" },
  { id = "fsautocomplete", language = "F#", extensions = [".fs",".fsi",".fsx"], command = ["fsautocomplete"], priority = 80, install = "dotnet tool install --global fsautocomplete" },
  { id = "gleam", language = "Gleam", extensions = [".gleam"], command = ["gleam","lsp"], priority = 80, install = "Install Gleam." },
  { id = "gopls", language = "Go", extensions = [".go"], command = ["gopls"], priority = 80, install = "go install golang.org/x/tools/gopls@latest" },
  { id = "graphql-language-service", language = "GraphQL", extensions = [".graphql",".gql"], command = ["graphql-lsp","server","-m","stream"], priority = 80, install = "npm install -g graphql-language-service-cli" },
  { id = "haskell-language-server", language = "Haskell", extensions = [".hs",".lhs"], command = ["haskell-language-server-wrapper","--lsp"], priority = 80, install = "Install haskell-language-server for the target toolchain." },
  { id = "html-language-server", language = "HTML", extensions = [".html",".htm"], command = ["vscode-html-language-server","--stdio"], priority = 80, install = "npm install -g vscode-langservers-extracted" },
  { id = "jdtls", language = "Java", extensions = [".java"], command = ["jdtls"], priority = 80, install = "Install Eclipse JDT LS." },
  { id = "json-language-server", language = "JSON", extensions = [".json",".jsonc"], command = ["vscode-json-language-server","--stdio"], priority = 80, install = "npm install -g vscode-langservers-extracted" },
  { id = "julia-language-server", language = "Julia", extensions = [".jl"], command = ["julia","--startup-file=no","--history-file=no","-e","using LanguageServer; runserver()"], priority = 80, install = "Install Julia LanguageServer.jl." },
  { id = "kotlin-language-server", language = "Kotlin", extensions = [".kt",".kts"], command = ["kotlin-language-server"], priority = 80, install = "Install kotlin-language-server." },
  { id = "lua-language-server", language = "Lua", extensions = [".lua"], command = ["lua-language-server"], priority = 80, install = "Install lua-language-server." },
  { id = "marksman", language = "Markdown", extensions = [".md",".markdown"], command = ["marksman","server"], priority = 80, install = "Install Marksman." },
  { id = "nixd", language = "Nix", extensions = [".nix"], command = ["nixd"], priority = 80, install = "Install nixd." },
  { id = "ocamllsp", language = "OCaml", extensions = [".ml",".mli"], command = ["ocamllsp"], priority = 80, install = "opam install ocaml-lsp-server" },
  { id = "omnisharp", language = "C#", extensions = [".cs",".csx"], command = ["OmniSharp","--languageserver"], priority = 80, install = "Install OmniSharp or a compatible C# language server." },
  { id = "phpactor", language = "PHP", extensions = [".php"], command = ["phpactor","language-server"], priority = 80, install = "Install phpactor." },
  { id = "prisma-language-server", language = "Prisma", extensions = [".prisma"], command = ["prisma-language-server","--stdio"], priority = 80, install = "npm install -g @prisma/language-server" },
  { id = "rust-analyzer", language = "Rust", extensions = [".rs"], command = ["rust-analyzer"], priority = 80, install = "Install rust-analyzer." },
  { id = "solargraph", language = "Ruby", extensions = [".rb",".rake",".gemspec",".ru"], command = ["solargraph","stdio"], priority = 80, install = "gem install solargraph" },
  { id = "sourcekit-lsp", language = "Swift", extensions = [".swift"], command = ["sourcekit-lsp"], priority = 80, install = "Install Xcode command line tools or the Swift toolchain." },
  { id = "svelte-language-server", language = "Svelte", extensions = [".svelte"], command = ["svelteserver","--stdio"], priority = 80, install = "npm install -g svelte-language-server" },
  { id = "tailwindcss-language-server", language = "Tailwind CSS", extensions = [".html",".htm",".css",".scss",".less",".js",".jsx",".ts",".tsx",".vue",".svelte",".astro"], command = ["tailwindcss-language-server","--stdio"], priority = 30, install = "npm install -g @tailwindcss/language-server" },
  { id = "taplo", language = "TOML", extensions = [".toml"], command = ["taplo","lsp","stdio"], priority = 80, install = "cargo install taplo-cli --features lsp" },
  { id = "terraform-ls", language = "Terraform", extensions = [".tf",".tfvars"], command = ["terraform-ls","serve"], priority = 80, install = "Install terraform-ls." },
  { id = "texlab", language = "LaTeX", extensions = [".tex",".bib"], command = ["texlab"], priority = 80, install = "Install texlab." },
  { id = "tinymist", language = "Typst", extensions = [".typ"], command = ["tinymist"], priority = 80, install = "Install tinymist." },
  { id = "typescript", language = "TypeScript and JavaScript", extensions = [".ts",".tsx",".js",".jsx",".mjs",".cjs",".mts",".cts"], command = ["typescript-language-server","--stdio"], priority = 80, install = "npm install -g typescript typescript-language-server" },
  { id = "vue-language-server", language = "Vue", extensions = [".vue"], command = ["vue-language-server","--stdio"], priority = 80, install = "npm install -g @vue/language-server" },
  { id = "yaml-ls", language = "YAML", extensions = [".yaml",".yml"], command = ["yaml-language-server","--stdio"], priority = 80, install = "npm install -g yaml-language-server" },
  { id = "zls", language = "Zig", extensions = [".zig",".zon"], command = ["zls"], priority = 80, install = "Install zls." }
]
