interface:
  display_name: "Planning"
  short_description: "Create or update actionable plans with safe local persistence."
  default_prompt: "You MUST use $planning for an actionable project plan or update. MUST separate objective, current evidence, preserved behavior, exclusions, decisions, assumptions, and unknowns; MUST make each work item self-contained with scope, inputs, completion, verification, and stop/report rules; MUST use the latest available sources, MUST preserve native goal and orchestration authority, and MUST honor read-only or output-only requests."
policy:
  allow_implicit_invocation: true
