interface:
  display_name: "Planning"
  short_description: "Create or update actionable plans with safe local persistence."
  default_prompt: "You MUST use $planning for an actionable project plan or update. Separate objective, current evidence, preserved behavior, exclusions, decisions, assumptions, and unknowns; make each work item self-contained with scope, inputs, completion, verification, and stop/report rules; use the latest available sources, preserve native goal and orchestration authority, and honor read-only or output-only requests."
policy:
  allow_implicit_invocation: true
