interface:
  display_name: "Project Brief"
  short_description: "Show a read-only human re-entry brief from recorded live state."
  default_prompt: "You MUST use $project-brief to present a read-only human re-entry brief for this task. You MUST read only current task, Git/PR, proof, and current release state; you MUST NOT mutate or invent fields."
policy:
  allow_implicit_invocation: true
