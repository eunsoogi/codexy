interface:
  display_name: "Execution Coordinator"
  short_description: "Classify and coordinate goals, agents, threads, compaction, and worktrees."
  default_prompt: "You MUST use $orchestration first to identify task surfaces, ownership, concrete risks, and proportionate verification. MUST NOT select light, standard, or strict tiers. MUST preserve security, permission, destructive-action, and external-mutation safeguards. Sentinel review is optional and final-only; if selected, MUST use at most three assessments including the initial review as operating guidance, not a runtime quota. MUST report unresolved blockers rather than manufacture a pass."
policy:
  allow_implicit_invocation: true
guidance: "After a forked Codex worktree child thread finishes setup and a thread id is available, the orchestrator MUST call set_thread_title when available; the title MUST clearly include project, issue number, and lane purpose so users can distinguish concurrent child threads; if title renaming is unavailable, the orchestrator MUST report the limitation and MUST continue because thread title clarity is not a merge blocker."
