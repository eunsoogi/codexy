interface:
  display_name: "Goal State Recovery"
  short_description: "Recover stale blocked goals before resuming work."
  default_prompt: "You MUST use $goal-state-recovery when real goal tools are in use or a task resumes from a goal state; administratively clear only stale blocked goal state, then create and read back a fresh active goal before work."
policy:
  allow_implicit_invocation: true
