interface:
  display_name: "Goal Lifecycle"
  short_description: "Use goal tools and recover blocked goals through a preserved-model fork."
  default_prompt: "You MUST use $goal-lifecycle before authorized Orchestrator or Worker task work and every native goal operation. For authorized blocked-goal recovery, you MUST NOT mark the unfinished goal complete; you MUST fork in the same directory, archive the source, pass its model and reasoning effort explicitly, and confirm an active goal before work."
policy:
  allow_implicit_invocation: true
