interface:
  display_name: "Goal Lifecycle"
  short_description: "Use goal tools and follow supported same-directory recovery for blocked goals."
  default_prompt: "You MUST use $goal-lifecycle before authorized Orchestrator or Worker task work and every native goal operation. Recovery of an unchanged objective and scope carries the original assignment authority; a blocked state alone MUST NOT require new user confirmation. You MUST NOT mark an unfinished goal complete to obtain recovery. You MUST verify the actual same-directory fork, exact CWD, Git checkout identity, and a successful lightweight process. You MUST archive the source chat, then verify the archived source, sole owner, goal, and process at that checkout. An empty, unsupported, or failed artifact listing MUST NOT block a successful exact-CWD recovery; a missing lifetime guarantee MUST NOT add a gate. If the continuation remains blocked, it MUST remain in recovery-only mode and the owner MUST continue the same procedure from that current owner. Issue work MUST remain stopped until the exact authorized objective is active and the checkout process succeeds. The owner MUST report requested model/effort separately from host-exposed effective settings."
policy:
  allow_implicit_invocation: true
