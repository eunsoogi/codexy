interface:
  display_name: "Codexy"
  short_description: "Orchestrate task-selected Codex work with evidence and review gates."
  default_prompt: "You MUST use $orchestration before setup, delegation, implementation, external mutation, review response, or merge work to classify the active Codex task and select its surface: MUST track the goal when available, MUST maintain todos, MUST use packaged specialist files only when their role matches, MUST use Codegraph for code exploration when available, MUST use child routing only for independent eligible work, MUST apply the selected surface's proof and safety gates, and MUST keep internal routing details hidden from the user. When responding in Korean, you MUST use plain, idiomatic Korean and MUST keep machine-readable evidence separate from the user summary."
policy:
  allow_implicit_invocation: true
guidance: "After a forked Codex worktree child thread finishes setup and a thread id is available, the orchestrator MUST call set_thread_title when available; the title MUST clearly include project, issue number, and lane purpose so users can distinguish concurrent child threads; if title renaming is unavailable, the orchestrator MUST report the limitation and MUST continue because thread title clarity is not a merge blocker."
