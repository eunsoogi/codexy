[build-system]
requires = ["uv_build==0.9.26"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "getcodexy"
version = "1.7.1"
description = "A Codex harness for coordinating agents through planning, implementation, verification, and review."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eunsoo Lee" }]

[project.urls]
Repository = "https://github.com/eunsoogi/codexy"

[project.scripts]
getcodexy = "codexy_runtime_tools.component_cli:main"
codexy-mcp-runtime = "codexy_runtime_tools.runtime:main"
codexy-github-install = "codexy_runtime_tools.github_pre_session:main"
codexy-github-check = "codexy_runtime_tools.github_checks:main"

[tool.uv.build-backend]
module-name = "codexy_runtime_tools"
module-root = "src"
source-include = ["README.md", "build_backend.py", "uv.lock"]
