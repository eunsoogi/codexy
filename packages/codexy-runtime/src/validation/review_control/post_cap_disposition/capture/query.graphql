query($owner:String!, $name:String!, $pullRequest:Int!, $owningIssue:Int!) {
  repository(owner:$owner, name:$name) {
    pullRequest(number:$pullRequest) {
      number
      url
      state
      isDraft
      mergeStateStatus
      baseRefOid
      headRefOid
      repository { nameWithOwner }
      reviewThreads(first:100) {
        nodes {
          id
          isResolved
          isOutdated
          path
          comments(first:100) {
            nodes { url }
            pageInfo { hasNextPage }
          }
        }
        pageInfo { hasNextPage }
      }
      comments(first:100) {
        nodes {
          id
          databaseId
          url
          body
          createdAt
          updatedAt
          author { login }
          authorAssociation
          isMinimized
        }
        pageInfo { hasNextPage }
      }
    }
    issue(number:$owningIssue) {
      number
      url
      repository { nameWithOwner }
    }
  }
}
