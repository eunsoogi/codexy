name: Windows governance Git measurement
run-name: Governance measurement ${{ inputs.baseline_sha }} vs ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact baseline commit
        required: true
        type: string
      candidate_sha:
        description: Exact candidate and measurement controller commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.revision }} governance
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          path: .measurement-controller
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision == 'baseline' && inputs.baseline_sha || inputs.candidate_sha }}
          path: .measurement-${{ matrix.revision }}
          persist-credentials: false
      - name: Build exact source with a cold target
        shell: pwsh
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REVISION: ${{ matrix.revision }}
        run: |
          & .measurement-controller/.github/scripts/measure-governance-git-work.ps1 -Mode build -BaselineSha $env:BASELINE_SHA -CandidateSha $env:CANDIDATE_SHA -Revision $env:REVISION
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: governance-build-${{ matrix.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/governance-measurement/manifest.json
            ${{ runner.temp }}/governance-measurement/build.log
            ${{ runner.temp }}/governance-measurement/build.jsonl
            ${{ runner.temp }}/governance-measurement/payload
          if-no-files-found: error
          retention-days: 7

  measure:
    name: Compare ${{ matrix.order }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, candidate-first]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          path: .measurement-controller
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_sha }}
          path: .measurement-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          path: .measurement-candidate
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: governance-build-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governance-baseline
      - uses: actions/download-artifact@v8
        with:
          name: governance-build-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governance-candidate
      - name: Compare identical prebuilt workloads in both orders
        shell: pwsh
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MEASUREMENT_ORDER: ${{ matrix.order }}
        run: |
          & .measurement-controller/.github/scripts/measure-governance-git-work.ps1 -Mode measure -BaselineSha $env:BASELINE_SHA -CandidateSha $env:CANDIDATE_SHA -Order $env:MEASUREMENT_ORDER
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: governance-results-${{ matrix.order }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governance-measurement
          if-no-files-found: error
          retention-days: 7
