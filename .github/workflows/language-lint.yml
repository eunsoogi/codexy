name: Language lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Rust
            os: ubuntu-latest
          - language: Python
            os: ubuntu-latest
          - language: Shell
            os: ubuntu-latest
          - language: Text
            os: ubuntu-latest
          - language: PowerShell
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: matrix.language == 'Python'
        with:
          python-version: "3.12"
      - name: Install Ruff
        if: matrix.language == 'Python'
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tooling/lint-requirements.txt"
      - name: Install Rust tools
        if: matrix.language == 'Rust'
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@v5
        if: matrix.language == 'Text'
        with:
          node-version: "22"
      - name: Install Prettier
        if: matrix.language == 'Text'
        run: npm ci --ignore-scripts
      - name: Install ShellCheck and shfmt
        if: matrix.language == 'Shell'
        shell: bash
        run: |
          shellcheck="$(jq -r .shellcheck.version tooling/lint-tools.json)"
          shellcheck_sha="$(jq -r .shellcheck.linuxX64Sha256 tooling/lint-tools.json)"
          shfmt="$(jq -r .shfmt.version tooling/lint-tools.json)"
          shfmt_sha="$(jq -r .shfmt.linuxX64Sha256 tooling/lint-tools.json)"
          curl --fail --location --output "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck}/shellcheck-v${shellcheck}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$shellcheck_sha" "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check --status
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          curl --fail --location --output "$RUNNER_TEMP/shfmt" "https://github.com/mvdan/sh/releases/download/v${shfmt}/shfmt_v${shfmt}_linux_amd64"
          printf '%s  %s\n' "$shfmt_sha" "$RUNNER_TEMP/shfmt" | sha256sum --check --status
          echo "$RUNNER_TEMP/shellcheck-v${shellcheck}" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install PSScriptAnalyzer
        if: matrix.language == 'PowerShell'
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: Lint Rust
        if: matrix.language == 'Rust'
        run: |
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Lint Python
        if: matrix.language == 'Python'
        run: |
          ruff check .
          ruff format --check .
      - name: Lint shell scripts
        if: matrix.language == 'Shell'
        shell: bash
        run: |
          git ls-files -z '*.sh' | xargs -0r shellcheck
          git ls-files -z '*.sh' | xargs -0r shfmt -d
      - name: Lint supported text formats
        if: matrix.language == 'Text'
        run: npm run lint
      - name: Lint PowerShell
        if: matrix.language == 'PowerShell'
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity ParseError,Error,Warning
