name: Stage 13 Windows slow-path diagnostic

on:
  push:
    branches: [codexy/526-stage13-windows-slow-path]

permissions:
  contents: read

jobs:
  windows-stage13-slow-path:
    name: Stage 13 Windows full-workload trace
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Windows archive scanner prerequisite
        shell: pwsh
        run: scripts/install-windows-test-prerequisites.ps1

      - name: Prepare Windows Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unchanged full workload with timestamp observer
        shell: pwsh
        run: |
          $trace = Join-Path $env:RUNNER_TEMP "stage13-windows-slow-path.json"
          $log = Join-Path $env:RUNNER_TEMP "stage13-windows-profile.log"
          python scripts/stage13_windows_slow_path.py --trace $trace --windows 2>&1 |
            Tee-Object -FilePath $log
          $profileExit = $LASTEXITCODE
          "stage13-profile-exit=$profileExit"
          exit $profileExit

      - name: Upload diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage13-windows-slow-path
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stage13-windows-slow-path.json
            ${{ runner.temp }}/stage13-windows-profile.log
          retention-days: 7
