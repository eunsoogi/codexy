name: Verify selected marketplace runtime package

on:
  pull_request:
    paths:
      - "plugins/codexy/**"
      - "plugins/codexy-devtools/**"
      - ".codex/**"
      - ".agents/plugins/**"
      - "scripts/**"
      - ".github/workflows/plugin-runtime-binaries.yml"
  push:
    branches: [main]
    paths:
      - "plugins/codexy/**"
      - "plugins/codexy-devtools/**"
      - ".codex/**"
      - ".agents/plugins/**"
      - "scripts/**"
      - ".github/workflows/plugin-runtime-binaries.yml"

permissions:
  actions: read
  contents: read

jobs:
  verify-selected-package:
    name: Verify ${{ matrix.platform }} selected package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download and verify selected immutable bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          digest_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          mkdir -p dist
          if test -f .agents/plugins/runtime-activation.json; then
            record=.agents/plugins/runtime-activation.json
            RELEASE_TAG="$(jq -r .runtime.selectedTag .agents/plugins/release-publish-contract.json)"
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2> release-view-error; then
              mkdir public-release
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir public-release --pattern codexy-marketplace-plugin.tar.gz --pattern runtime-release-receipt.json
              receipt=public-release/runtime-release-receipt.json
              test "$(jq -r .release.tag "$receipt")" = "$RELEASE_TAG"
              test "$(jq -r .source.stagingSourceCommit "$receipt")" = "$(jq -r .candidate.source.commit "$record")"
              test "$(jq -r .staging.runId "$receipt")" = "$(jq -r .candidate.artifact.stagingRunId "$record")"
              test "$(jq -r .staging.runAttempt "$receipt")" = "$(jq -r .candidate.artifact.stagingRunAttempt "$record")"
              jq -cS .provenance "$receipt" | tr -d '\n' > public-provenance.json
              jq -cS .provenance "$record" | tr -d '\n' > activated-provenance.json
              cmp public-provenance.json activated-provenance.json || {
                printf '%s\n' "public release receipt does not match activated staging identity" >&2
                exit 1
              }
              cp public-release/codexy-marketplace-plugin.tar.gz dist/selected.tar.gz
              test "$(digest_file dist/selected.tar.gz)" = "$(jq -r .artifact.sha256 "$receipt")"
              : > dist/public-release
            else
              release_status=$?
              if ! grep -Eq 'HTTP 404|release not found' release-view-error; then
                cat release-view-error >&2
                exit "$release_status"
              fi
              export STAGING_RUN_ID="$(jq -r .candidate.artifact.stagingRunId "$record")"
              export SOURCE_COMMIT="$(jq -r .candidate.source.commit "$record")"
              scripts/download-runtime-staging-artifact staging
              cp staging/codexy-marketplace-plugin.tar.gz dist/selected.tar.gz
              test "$(digest_file dist/selected.tar.gz)" = "$(jq -r .artifact.sha256 "$record")"
            fi
            rm -f release-view-error
          else
            url="$(jq -r .artifact.url plugins/codexy-devtools/runtime-release.json)"
            digest="$(jq -r .artifact.sha256 plugins/codexy-devtools/runtime-release.json)"
            curl --fail --location "$url" -o dist/selected.tar.gz
            test "$(digest_file dist/selected.tar.gz)" = "$digest"
          fi
      - name: Assemble state-aware marketplace package without rebuilding
        run: |
          if test -f dist/public-release; then state=public-release
          elif test -f .agents/plugins/runtime-activation.json; then state=candidate-proven
          else state=legacy-public
          fi
          case "$state" in
          public-release)
            export STAGING_RUN_ID="$(jq -r .candidate.artifact.stagingRunId .agents/plugins/runtime-activation.json)"
            export STAGING_SOURCE_COMMIT="$(jq -r .candidate.source.commit .agents/plugins/runtime-activation.json)"
            export ACTIVATION_COMMIT="$(git rev-parse HEAD)"
            export RELEASE_TAG="$(jq -r .runtime.selectedTag .agents/plugins/release-publish-contract.json)"
            export PUBLIC_RELEASE=1
            scripts/materialize-runtime-release-archive dist/selected.tar.gz dist/codexy-marketplace-plugin.tar.gz
            mkdir -p final-inspect
            tar -xzf dist/codexy-marketplace-plugin.tar.gz -C final-inspect
            scripts/inspect-release-archive dist/codexy-marketplace-plugin.tar.gz final-inspect/plugins/codexy-devtools public-release
            ;;
          candidate-proven)
            export STAGING_RUN_ID="$(jq -r .candidate.artifact.stagingRunId .agents/plugins/runtime-activation.json)"
            export STAGING_SOURCE_COMMIT="$(jq -r .candidate.source.commit .agents/plugins/runtime-activation.json)"
            export ACTIVATION_COMMIT="$(git rev-parse HEAD)"
            export RELEASE_TAG="$(jq -r .runtime.selectedTag .agents/plugins/release-publish-contract.json)"
            scripts/materialize-runtime-release-archive dist/selected.tar.gz dist/codexy-marketplace-plugin.tar.gz
            mkdir -p final-inspect
            tar -xzf dist/codexy-marketplace-plugin.tar.gz -C final-inspect
            scripts/inspect-release-archive dist/codexy-marketplace-plugin.tar.gz final-inspect/plugins/codexy-devtools public-release
            ;;
          legacy-public)
            mkdir -p legacy final/plugins
            tar -xzf dist/selected.tar.gz -C legacy
            staged=final/plugins/codexy-devtools
            rsync -a --exclude runtime --exclude runtime-candidate.json plugins/codexy-devtools/ "$staged/"
            for path in \
              plugins/codexy-devtools/runtime/codexy-mcp-lsp-darwin-arm64.bin \
              plugins/codexy-devtools/runtime/codexy-mcp-codegraph-darwin-arm64.bin \
              plugins/codexy-devtools/runtime/codexy-mcp-lsp-linux-x86_64.bin \
              plugins/codexy-devtools/runtime/codexy-mcp-codegraph-linux-x86_64.bin; do test -f "legacy/$path"; done
            cp -R legacy/plugins/codexy-devtools/runtime "$staged/"
            tar -C final -czf dist/codexy-marketplace-plugin.tar.gz plugins/codexy-devtools
            scripts/inspect-release-archive dist/codexy-marketplace-plugin.tar.gz "$staged"
            ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: codexy-marketplace-plugin-${{ matrix.platform }}
          path: dist/codexy-marketplace-plugin.tar.gz
          if-no-files-found: error

  verify-windows-selected-candidate:
    name: Verify native Windows selected candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify immutable native Windows candidate bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          if (-not (Test-Path -LiteralPath ".agents/plugins/runtime-activation.json" -PathType Leaf)) {
            Write-Output "legacy-public baseline intentionally has no selected Windows candidate"
            exit 0
          }
          $record = Get-Content -Raw ".agents/plugins/runtime-activation.json" | ConvertFrom-Json
          Write-Output "candidate-proven private activation record"
          $env:STAGING_RUN_ID = "$($record.candidate.artifact.stagingRunId)"
          $env:STAGING_SOURCE_COMMIT = "$($record.candidate.source.commit)"
          $env:SOURCE_COMMIT = $env:STAGING_SOURCE_COMMIT
          $env:ACTIVATION_COMMIT = (git rev-parse HEAD)
          $env:RELEASE_TAG = (Get-Content -Raw ".agents/plugins/release-publish-contract.json" | ConvertFrom-Json).runtime.selectedTag
          $releaseOutput = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>&1
          $releaseStatus = $LASTEXITCODE
          if ($releaseStatus -eq 0) {
            New-Item -ItemType Directory -Path public-release -ErrorAction Stop | Out-Null
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir public-release --pattern codexy-marketplace-plugin.tar.gz --pattern runtime-release-receipt.json
            if ($LASTEXITCODE -ne 0) { throw "public release download failed" }
            $receipt = Get-Content -Raw public-release/runtime-release-receipt.json | ConvertFrom-Json
            if ($receipt.release.tag -ne $env:RELEASE_TAG) { throw "public release tag mismatch" }
            if ("$($receipt.source.stagingSourceCommit)" -ne "$($record.candidate.source.commit)") { throw "public release source mismatch" }
            if ("$($receipt.staging.runId)" -ne "$($record.candidate.artifact.stagingRunId)") { throw "public release run identity mismatch" }
            if ("$($receipt.staging.runAttempt)" -ne "$($record.candidate.artifact.stagingRunAttempt)") { throw "public release run attempt mismatch" }
            $publicProvenance = jq -cS .provenance public-release/runtime-release-receipt.json
            $activatedProvenance = jq -cS .provenance .agents/plugins/runtime-activation.json
            if ($publicProvenance -ne $activatedProvenance) { throw "public release receipt does not match activated staging identity" }
            $archive = "public-release/codexy-marketplace-plugin.tar.gz"
            if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $receipt.artifact.sha256) { throw "public release archive digest mismatch" }
            $publicArchive = $true
          } else {
            if ($releaseOutput -notmatch "HTTP 404|release not found") {
              $releaseOutput | Write-Error
              exit $releaseStatus
            }
            bash scripts/download-runtime-staging-artifact staging
            if ($LASTEXITCODE -ne 0) { throw "authenticated candidate download failed" }
            $archive = "staging/codexy-marketplace-plugin.tar.gz"
            if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $record.artifact.sha256) { throw "candidate archive digest mismatch" }
            $publicArchive = $false
          }
          $root = Join-Path $env:RUNNER_TEMP "selected-candidate"
          if (Test-Path -LiteralPath $root) { throw "candidate extraction root must be fresh: $root" }
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $windowsTar = Join-Path $env:SystemRoot "System32/tar.exe"
          & $windowsTar -xzf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw "native Windows archive extraction failed" }
          New-Item -ItemType Directory -Path dist -ErrorAction Stop | Out-Null
          if ($publicArchive) { $env:PUBLIC_RELEASE = "1" }
          else { Remove-Item Env:PUBLIC_RELEASE -ErrorAction SilentlyContinue }
          bash scripts/materialize-runtime-release-archive $archive dist/codexy-marketplace-plugin.tar.gz
          if ($LASTEXITCODE -ne 0) { throw "public archive projection failed" }
          $public = Join-Path $env:RUNNER_TEMP "public-marketplace"
          New-Item -ItemType Directory -Path $public -ErrorAction Stop | Out-Null
          & $windowsTar -xzf dist/codexy-marketplace-plugin.tar.gz -C $public
          if ($LASTEXITCODE -ne 0) { throw "native Windows public archive extraction failed" }
          bash scripts/inspect-release-archive dist/codexy-marketplace-plugin.tar.gz "$public/plugins/codexy-devtools" public-release
          if ($LASTEXITCODE -ne 0) { throw "public archive inspection failed" }
          $entrypoint = Join-Path $public "plugins/codexy-devtools/mcp/codexy-mcp-devtools.exe"
          foreach ($server in @("lsp", "codegraph")) {
            $runtime = Join-Path $public "plugins/codexy-devtools/runtime/codexy-mcp-$server-windows-x86_64.exe"
            if ((Get-FileHash $runtime).Hash -eq (Get-FileHash $entrypoint).Hash) { throw "$server runtime duplicates the shared dispatcher" }
            & $entrypoint $server --help
            if ($LASTEXITCODE -ne 0) { throw "native Windows projected dispatcher failed: $server" }
          }
