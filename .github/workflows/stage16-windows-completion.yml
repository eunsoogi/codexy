name: Stage 16 Windows completion diagnostic

on:
  push:
    branches: [codexy/526-windows-rust-ubuntu-budget-recovery]

permissions:
  contents: read

jobs:
  windows-stage16-completion:
    name: Stage 16 Windows full-workload completion trace
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Windows archive scanner prerequisite
        shell: pwsh
        run: scripts/install-windows-test-prerequisites.ps1

      - name: Prepare Windows Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unchanged full workload through completion observer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "stage16-windows-profile.log"
          python scripts/profile-rust-tests --windows --budget-seconds 900 2>&1 |
            Tee-Object -FilePath $log
          $profileExit = $LASTEXITCODE
          "stage16-profile-exit=$profileExit"
          exit $profileExit

      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage16-windows-completion
          if-no-files-found: error
          path: ${{ runner.temp }}/stage16-windows-profile.log
          retention-days: 7
