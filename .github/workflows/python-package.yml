name: Check getcodexy bootstrap package

on:
  pull_request:
    paths:
      - "packages/getcodexy/**"
      - "plugins/codexy/**"
      - "plugins/codexy-github/**"
      - "plugins/codexy-devtools/**"
      - ".agents/plugins/marketplace.json"
      - "docs/getcodexy-component-installation.md"
      - ".github/workflows/python-package.yml"
      - ".github/workflows/bootstrap-package.yml"
  push:
    branches: [main]
    paths:
      - "packages/getcodexy/**"
      - "plugins/codexy/**"
      - "plugins/codexy-github/**"
      - "plugins/codexy-devtools/**"
      - ".agents/plugins/marketplace.json"
      - "docs/getcodexy-component-installation.md"
      - ".github/workflows/python-package.yml"
      - ".github/workflows/bootstrap-package.yml"

permissions:
  contents: read

jobs:
  test:
    name: Package lifecycle (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            runner: ubuntu-latest
          - platform: macos
            runner: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run focused package tests
        run: PYTHONPATH=packages/getcodexy/src python -m unittest discover -s packages/getcodexy/tests -p 'test_*.py'
      - name: Build distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir dist packages/getcodexy
      - name: Verify installed wheel and console entrypoint
        run: |
          version="$(python -c 'import tomllib; print(next(package["version"] for package in tomllib.load(open("packages/getcodexy/uv.lock", "rb"))["package"] if package["name"] == "getcodexy"))')"
          test "$version" = "$(python -c 'import tomllib; print(tomllib.load(open("packages/getcodexy/pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --no-index --find-links dist "getcodexy==${version}"
          .package-venv/bin/python -c 'from codexy_runtime_tools.version_lock import default_package_version; assert default_package_version() == "'"$version"'"'
          .package-venv/bin/codexy-mcp-runtime --help
          GETCODEXY_DISTRIBUTION_EXECUTABLE="$PWD/.package-venv/bin/getcodexy" PYTHONPATH=packages/getcodexy/tests .package-venv/bin/python -m unittest packages/getcodexy/tests/test_component_distribution.py packages/getcodexy/tests/test_component_capability_probe.py
      - uses: actions/upload-artifact@v7
        with:
          name: getcodexy-bootstrap-package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  github-activation-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run native component lifecycle tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = "packages/getcodexy/src;packages/getcodexy/tests"
          $hookRoot = Join-Path $PWD "plugins/codexy-github/hooks"
          $expectedContext = '{"hookSpecificOutput":{"hookEventName":"UserPromptSubmit","additionalContext":"Codexy GitHub workflow is installed. Use $git-workflow; its package-owned generic admission hooks are active."}}'
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $context = '{"prompt":"GitHub"}' | & (Join-Path $hookRoot "codexy-github-workflow-context.cmd")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stopwatch.Stop()
          $elapsed = $stopwatch.Elapsed.TotalSeconds
          Write-Host (@{ windows_first_cold_github_hook_seconds = $elapsed } | ConvertTo-Json -Compress)
          if ($context -cne $expectedContext) { throw "first cold GitHub hook returned unexpected output" }
          if ($elapsed -ge 4.5) { throw "first cold GitHub hook invocation took $elapsed seconds" }
          python -m unittest packages/getcodexy/tests/test_github_native_hooks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $componentTests = @(
            "packages/getcodexy/tests/test_component_cli.py"
            "packages/getcodexy/tests/test_component_lifecycle.py"
            "packages/getcodexy/tests/test_component_lifecycle_version_admission.py"
            "packages/getcodexy/tests/test_component_lifecycle_interrupt.py"
            "packages/getcodexy/tests/test_component_lifecycle_journal.py"
            "packages/getcodexy/tests/test_component_transition_model.py"
            "packages/getcodexy/tests/test_component_lifecycle_finalization.py"
            "packages/getcodexy/tests/test_component_lifecycle_preflight.py"
            "packages/getcodexy/tests/test_component_lifecycle_update_recovery.py"
            "packages/getcodexy/tests/test_component_lifecycle_admission.py"
            "packages/getcodexy/tests/test_component_transaction_durability.py"
          )
          python -m unittest @componentTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test dependency-aware GitHub activation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = "packages/getcodexy/src;packages/getcodexy/tests"
          python -m unittest packages/getcodexy/tests/test_github_pre_session_install.py packages/getcodexy/tests/test_public_activation_contract.py packages/getcodexy/tests/test_version_lock.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --outdir dist packages/getcodexy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .package-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "import tomllib; print(next(package['version'] for package in tomllib.load(open('packages/getcodexy/uv.lock', 'rb'))['package'] if package['name'] == 'getcodexy'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('packages/getcodexy/pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne $projectVersion) { throw "getcodexy version projections are not synchronized" }
          .package-venv\Scripts\python -m pip install --no-index --find-links dist "getcodexy==$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .package-venv\Scripts\python -c "from codexy_runtime_tools.version_lock import default_package_version; assert default_package_version() == '$version'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .package-venv\Scripts\getcodexy.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GETCODEXY_DISTRIBUTION_EXECUTABLE = "$PWD\.package-venv\Scripts\getcodexy.exe"
          $env:PYTHONPATH = "packages/getcodexy/tests"
          .package-venv\Scripts\python -m unittest packages/getcodexy/tests/test_component_distribution.py packages/getcodexy/tests/test_component_capability_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .package-venv\Scripts\codexy-github-install.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkRoot = Join-Path $env:RUNNER_TEMP "codexy github check"
          New-Item -ItemType Directory -Force -Path $checkRoot | Out-Null
          $state = Join-Path $checkRoot "pr state.json"
          $statePayload = @{
            state = "OPEN"
            repository = "owner/repo"
            labels = @(@{ name = "type/refactor" })
            repositoryLabels = @(@{ name = "type/refactor" })
          } | ConvertTo-Json -Compress
          Set-Content -NoNewline -Path $state -Value $statePayload
          .package-venv\Scripts\codexy-github-check.exe --check-issue-title --issue-title "Extract GitHub workflow"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .package-venv\Scripts\codexy-github-check.exe --check-pr-labels --pr-state-file $state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mergeMessage = @(
            "refactor(github): extract workflow (#553)"
            ""
            "Fixes #552"
          ) -join "`n"
          .package-venv\Scripts\codexy-github-check.exe --check-merge-message --expected-pr 553 --expected-issue 552 --merge-message $mergeMessage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hookRoot = Join-Path $env:RUNNER_TEMP "codexy github hook"
          Copy-Item -Recurse -Force plugins/codexy-github/hooks $hookRoot
          $context = '{"prompt":"Open a GitHub issue"}' | & (Join-Path $hookRoot "codexy-github-workflow-context.cmd")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($context -notmatch '\$git-workflow') { throw "installed GitHub hook did not add workflow context" }
          $admission = '{"tool_input":{"title":"Extract GitHub workflow"}}' | & (Join-Path $hookRoot "codexy-github-admission-issue.cmd")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($admission -notmatch '"permissionDecision":"deny"') { throw "installed GitHub admission hook did not deny an invalid title" }
