name: Rust tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust shard (Ubuntu, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [support, agent, child, orchestration, governance, system, archive]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run:
          scripts/profile-rust-tests --shard ${{ matrix.shard }} --receipt receipts/posix-${{
          matrix.shard }}.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-receipt-posix-${{ matrix.shard }}
          path: receipts/posix-${{ matrix.shard }}.json
          if-no-files-found: error

  windows-rust-test:
    name: Rust shard (Windows, ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [support, agent, child, orchestration, governance, system, archive]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - shell: pwsh
        run: scripts/install-windows-test-prerequisites.ps1
      - shell: pwsh
        run:
          rustup toolchain install; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; cargo fetch
          --manifest-path packages/codexy-runtime/Cargo.toml --locked; if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE }
      - run:
          python scripts/profile-rust-tests --windows --shard ${{ matrix.shard }} --receipt
          receipts/windows-${{ matrix.shard }}.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-receipt-windows-${{ matrix.shard }}
          path: receipts/windows-${{ matrix.shard }}.json
          if-no-files-found: error

  rust-test-aggregate:
    needs: [rust-test, windows-rust-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: rust-receipt-*
          merge-multiple: true
          path: receipts
      - run: scripts/profile-rust-tests --aggregate-receipts receipts
