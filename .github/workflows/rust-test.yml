name: Rust tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-harness-benchmark:
    name: Disposable Windows harness benchmark
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run one source-identical benchmark
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "stage11-harness-benchmark"
          New-Item -ItemType Directory -Force $evidence | Out-Null
          cargo test --locked --test suite_all stage11_harness_benchmark::stage11_harness_architecture_benchmark_preserves_private_fixture_semantics -- --exact --nocapture 2>&1 | Tee-Object -FilePath (Join-Path $evidence "benchmark.log")
          $status = $LASTEXITCODE
          Get-FileHash (Join-Path $evidence "benchmark.log") -Algorithm SHA256 | Format-List | Out-File (Join-Path $evidence "benchmark.sha256")
          if ($status -ne 0) { exit $status }

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11-windows-harness-benchmark
          path: ${{ runner.temp }}/stage11-harness-benchmark
