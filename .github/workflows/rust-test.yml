name: Rust tests
run-name: ${{ format('{0} {1}', github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && 'Measurement' || 'CI', github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact frozen commit SHA to measure
        required: true
        type: string
      condition:
        description: Controlled cache condition
        required: true
        type: choice
        options: [cold, warm]
      cache_mode:
        description: Cache path used by the measurement
        required: true
        default: isolated
        type: choice
        options: [isolated, normal]
      repeat_id:
        description: Repeat identity such as cold-1
        required: true
        type: string
      profiling:
        description: Export existing profile metrics
        required: true
        default: false
        type: boolean
      cache_identity:
        description: Cache identity shared by cold and warm repeats
        required: true
        type: string
      run_mode:
        description: Mode
        required: true
        default: measurement
        type: choice
        options: [measurement, ci]
permissions:
  contents: read

env:
  CODEXY_WINDOWS_TOOLCHAIN_CACHE_SUBPATH: .rustup/toolchains/stable-x86_64-pc-windows-msvc

jobs:
  rust-test:
    name: Rust tests (Ubuntu / ${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: &rust-targets
          - name: orchestration suite
            args: --test suite_orchestration
          - name: library and binaries
            args: --lib --bins
          - name: support suite
            args: --test suite_support
          - name: agent suite
            args: --test suite_agent
          - name: child suite
            args: --test suite_child
          - name: governance suite
            args: --test suite_governance
          - name: governance workflows suite
            args: --test suite_governance_workflows
          - name: system suite
            args: --test suite_system
          - name: runtime suite
            args: --test suite_runtime
          - name: runtime activation suite
            args: --test suite_runtime_activation
          - name: runtime activation autocrlf suite
            args: --test suite_runtime_activation_autocrlf
          - name: sync version suite
            args: --test suite_sync_version
          - name: archive suite
            args: --test suite_archive
    steps:
      - &rust-checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and prepare measurement
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement'
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          CONDITION: ${{ inputs.condition }}
          CACHE_MODE: ${{ inputs.cache_mode }}
          REPEAT_ID: ${{ inputs.repeat_id }}
          CACHE_IDENTITY: ${{ inputs.cache_identity }}
          PROFILE_ENABLED: ${{ inputs.profiling && 'true' || 'false' }}
          SHARD_INDEX: ${{ strategy.job-index }}
        run: scripts/prepare-rust-measurement.sh
      - name: Identify runner Rust toolchain
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'ci' || inputs.cache_mode == 'normal'
        id: rust_toolchain_identity
        shell: bash
        run: |
          metadata="$(rustc -vV)"
          expected_head='${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'; test "$(git rev-parse HEAD)" = "$expected_head"
          release="$(printf '%s\n' "$metadata" | awk '$1 == "release:" { print $2 }')"
          target_host="$(printf '%s\n' "$metadata" | awk '$1 == "host:" { print $2 }')"
          test -n "$release" && test -n "$target_host"
          printf 'identity=%s-%s\n' "$release" "$target_host" >> "$GITHUB_OUTPUT"
      - name: Clear normal measurement cache paths
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && inputs.cache_mode == 'normal' && inputs.condition == 'cold'
        run: rm -rf -- "$HOME/.cargo/registry" "packages/codexy-runtime/target"
      - &rust-cache-restore
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'ci' || inputs.cache_mode == 'normal'
        id: rust-cache
        uses: actions/cache/restore@v5
        with:
          path: &rust-cache-path |
            ~/.cargo/registry
            packages/codexy-runtime/target
            ${{ runner.os == 'Windows' && format('~/{0}/*', env.CODEXY_WINDOWS_TOOLCHAIN_CACHE_SUBPATH) || '' }}
            ${{ runner.os == 'Windows' && format('!~/{0}/share', env.CODEXY_WINDOWS_TOOLCHAIN_CACHE_SUBPATH) || '' }}
            ${{ runner.os == 'Windows' && format('~/{0}/share/*', env.CODEXY_WINDOWS_TOOLCHAIN_CACHE_SUBPATH) || '' }}
            ${{ runner.os == 'Windows' && format('!~/{0}/share/doc', env.CODEXY_WINDOWS_TOOLCHAIN_CACHE_SUBPATH) || '' }}
          key: &rust-cache-key >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' &&
            inputs.cache_mode == 'normal' &&
            format('codexy-rust-normal-measurement-rustup-toolchain-v3-{0}-{1}-{2}-{3}-profile-test-{4}-{5}-{6}-{7}', runner.os, runner.arch, hashFiles('packages/codexy-runtime/rust-toolchain.toml'), hashFiles('packages/codexy-runtime/Cargo.lock'), matrix.target.name, inputs.head_sha, inputs.cache_identity, steps.rust_toolchain_identity.outputs.identity) ||
            format('codexy-rust-rustup-toolchain-v3-{0}-{1}-{2}-{3}-profile-test-{4}-{5}', runner.os, runner.arch, hashFiles('packages/codexy-runtime/rust-toolchain.toml'), hashFiles('packages/codexy-runtime/Cargo.lock'), matrix.target.name, steps.rust_toolchain_identity.outputs.identity) }}
      - &measurement-cache-restore
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && inputs.cache_mode == 'isolated' && inputs.condition == 'warm'
        id: measurement-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/codexy-rust-measurement/cargo
            ${{ runner.temp }}/codexy-rust-measurement/rustup
            ${{ runner.temp }}/codexy-rust-measurement/target
          key: codexy-rust-measurement-${{ runner.os }}-${{ inputs.head_sha }}-${{ inputs.cache_identity }}-${{ strategy.job-index }}
      - name: Verify measurement cache result
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && always()
        shell: bash
        env:
          CODEXY_MEASUREMENT_MODE: ${{ inputs.cache_mode }}
          CODEXY_MEASUREMENT_CONDITION: ${{ inputs.condition }}
          CODEXY_MEASUREMENT_CACHE_HIT: ${{ inputs.cache_mode == 'normal' && steps.rust-cache.outputs.cache-hit || steps.measurement-cache.outputs.cache-hit }}
          CODEXY_MEASUREMENT_ROOT: ${{ runner.temp }}/codexy-rust-measurement
        run: scripts/verify-rust-measurement-cache.sh
      - name: Install archive scanner
        if: matrix.target.name == 'archive suite'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Prepare opt-in measurement toolchain
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && inputs.cache_mode == 'isolated'
        run: CODEXY_MEASUREMENT_CONDITION='${{ inputs.condition }}' scripts/prepare-rust-measurement-toolchain.sh
      - run: cargo test --manifest-path packages/codexy-runtime/Cargo.toml --locked ${{ matrix.target.args }}
      - &rust-cache-save
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && inputs.cache_mode == 'normal' && inputs.condition == 'cold') && steps.rust-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v5
        with:
          path: *rust-cache-path
          key: *rust-cache-key
      - &measurement-cache-save
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && inputs.cache_mode == 'isolated' && inputs.condition == 'cold' && success()
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/codexy-rust-measurement/cargo
            ${{ runner.temp }}/codexy-rust-measurement/rustup
            ${{ runner.temp }}/codexy-rust-measurement/target
          key: codexy-rust-measurement-${{ runner.os }}-${{ inputs.head_sha }}-${{ inputs.cache_identity }}-${{ strategy.job-index }}
      - &measurement-upload
        name: Upload opt-in measurement artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && (inputs.cache_mode == 'isolated' || inputs.profiling == true) && always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-ci-cost-${{ github.run_id }}-${{ runner.os }}-${{ strategy.job-index }}-${{ inputs.head_sha }}-${{ inputs.condition }}-${{ inputs.repeat_id }}-${{ inputs.profiling }}-${{ inputs.cache_identity }}
          path: ${{ runner.temp }}/codexy-rust-measurement/metrics
          if-no-files-found: warn
          retention-days: 14

  windows-rust-test:
    name: Rust tests (Windows / ${{ matrix.target.name }})
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: *rust-targets
    steps:
      - *rust-checkout
      - name: Validate and prepare measurement
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement'
        shell: pwsh
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          CONDITION: ${{ inputs.condition }}
          CACHE_MODE: ${{ inputs.cache_mode }}
          REPEAT_ID: ${{ inputs.repeat_id }}
          CACHE_IDENTITY: ${{ inputs.cache_identity }}
          PROFILE_ENABLED: ${{ inputs.profiling && 'true' || 'false' }}
          SHARD_INDEX: ${{ strategy.job-index }}
        run: scripts/prepare-rust-measurement.ps1
      - name: Identify runner Rust toolchain
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'ci' || inputs.cache_mode == 'normal'
        id: rust_toolchain_identity
        shell: pwsh
        run: |
          $metadata = @(& rustc -vV)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadataText = $metadata -join "`n"
          $release = [regex]::Match($metadataText, '(?m)^release:\s+(\S+)$').Groups[1].Value
          $targetHost = [regex]::Match($metadataText, '(?m)^host:\s+(\S+)$').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($release) -or [string]::IsNullOrWhiteSpace($targetHost)) { throw "rustc -vV must report release and host" }
          $expectedHead = '${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'; if ((git rev-parse HEAD).Trim() -ne $expectedHead) { throw "checked out source commit does not match requested head" }
          "identity=$release-$targetHost" >> $env:GITHUB_OUTPUT
      - name: Clear normal measurement cache paths
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && inputs.cache_mode == 'normal' && inputs.condition == 'cold'
        shell: pwsh
        run: |
          $toolchainCachePath = Join-Path $HOME $env:CODEXY_WINDOWS_TOOLCHAIN_CACHE_SUBPATH
          Remove-Item -LiteralPath "$HOME/.cargo/registry", "packages/codexy-runtime/target", $toolchainCachePath -Recurse -Force -ErrorAction SilentlyContinue
      - *rust-cache-restore
      - *measurement-cache-restore
      - name: Verify measurement cache result
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && always()
        shell: pwsh
        env:
          CODEXY_MEASUREMENT_MODE: ${{ inputs.cache_mode }}
          CODEXY_MEASUREMENT_CONDITION: ${{ inputs.condition }}
          CODEXY_MEASUREMENT_CACHE_HIT: ${{ inputs.cache_mode == 'normal' && steps.rust-cache.outputs.cache-hit || steps.measurement-cache.outputs.cache-hit }}
          CODEXY_MEASUREMENT_ROOT: ${{ runner.temp }}/codexy-rust-measurement
        run: scripts/verify-rust-measurement-cache.ps1
      - shell: pwsh
        run: scripts/install-windows-test-prerequisites.ps1
      - shell: pwsh
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'ci' || inputs.cache_mode == 'normal'
        run: scripts/ensure-rust-toolchain.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; .github/scripts/report-rust-cache-docs.ps1 '${{ matrix.target.name }}'
      - name: Prepare opt-in measurement toolchain
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'measurement' && inputs.cache_mode == 'isolated'
        shell: pwsh
        run: $env:CODEXY_MEASUREMENT_CONDITION = '${{ inputs.condition }}'; scripts/prepare-rust-measurement-toolchain.ps1
      - shell: pwsh
        run: cargo test --manifest-path packages/codexy-runtime/Cargo.toml --locked ${{ matrix.target.args }}; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - *rust-cache-save
      - *measurement-cache-save
      - *measurement-upload
