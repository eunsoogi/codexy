name: Rust tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: cargo test --manifest-path packages/codexy-runtime/Cargo.toml --locked --all-targets

  windows-rust-test:
    name: Rust tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - shell: pwsh
        run: scripts/install-windows-test-prerequisites.ps1
      - shell: pwsh
        run: rustup toolchain install; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; cargo fetch --manifest-path packages/codexy-runtime/Cargo.toml --locked; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - shell: pwsh
        run: cargo test --manifest-path packages/codexy-runtime/Cargo.toml --locked --all-targets --features runtime-activation; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
