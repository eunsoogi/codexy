name: Touched LOC gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact commit to validate
        required: true
        type: string
      base_sha:
        description: Exact base commit for the touched-file diff
        required: true
        type: string

permissions:
  contents: read

jobs:
  touched-loc:
    name: Validate touched implementation LOC
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head and base commits
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
        run: |
          test "$HEAD_SHA" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"

      - name: Validate touched implementation LOC
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
        run: scripts/validate-plugin-config.sh --check-touched-loc --base-ref "$BASE_SHA"
