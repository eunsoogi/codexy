name: Reject retired getcodexy bootstrap publication

on:
  workflow_dispatch:
    inputs:
      bootstrap_version:
        description: "Retired bootstrap version; final release publication owns PyPI"
        required: true
        type: string
      source_commit:
        description: "Retired source input; final release publication owns PyPI"
        required: true
        type: string

concurrency:
  group: codexy-bootstrap-${{ inputs.bootstrap_version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-bootstrap:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject bootstrap-first PyPI publication
        run: |
          echo "bootstrap-first PyPI publication is retired; the final publisher must create the GitHub release first." >&2
          exit 1
