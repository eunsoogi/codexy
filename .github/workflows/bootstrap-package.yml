name: Publish verified getcodexy bootstrap

on:
  workflow_dispatch:
    inputs:
      bootstrap_version:
        description: "Unpublished getcodexy version to publish, for example 1.3.0"
        required: true
        type: string
      source_commit:
        description: "Exact immutable source commit to build"
        required: true
        type: string

concurrency:
  group: codexy-bootstrap-${{ inputs.bootstrap_version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-bootstrap:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/getcodexy
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Admit current protected-main bootstrap source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
        run: |
          test "${#SOURCE_COMMIT}" = 40
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_at_admission="$(git rev-parse origin/main)"
          test "$SOURCE_COMMIT" = "$main_at_admission"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          version="$(python3 -c 'import tomllib; print(next(package["version"] for package in tomllib.load(open("packages/getcodexy/uv.lock", "rb"))["package"] if package["name"] == "getcodexy"))')"
          test "$version" = "$(python3 -c 'import tomllib; print(tomllib.load(open("packages/getcodexy/pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$BOOTSTRAP_VERSION"
      - name: Admit protected PyPI environment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/admit-pypi-environment
      - name: Build and publish bootstrap package
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir dist packages/getcodexy
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Prove public wheel and source distribution availability
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
        run: |
          attempt=0
          until curl --fail --silent --show-error --location "https://pypi.org/pypi/getcodexy/${BOOTSTRAP_VERSION}/json" -o pypi.json; do
            attempt=$((attempt + 1))
            test "$attempt" -lt 12 || exit 1
            sleep 10
          done
          BOOTSTRAP_VERSION="$BOOTSTRAP_VERSION" python3 - <<'PY' > public-artifacts.tsv
          import json, os
          document = json.load(open("pypi.json", encoding="utf-8"))
          if document["info"]["version"] != os.environ["BOOTSTRAP_VERSION"]:
              raise SystemExit("PyPI version mismatch")
          files = document["urls"]
          for package_type in ("bdist_wheel", "sdist"):
              matches = [item for item in files if item["packagetype"] == package_type]
              if len(matches) != 1:
                  raise SystemExit(f"expected one public {package_type}, got {len(matches)}")
              item = matches[0]
              print(package_type, item["url"], item["digests"]["sha256"], sep="\t")
          PY
          while IFS="$(printf '\t')" read -r package_type url digest; do
            curl --fail --silent --show-error --location "$url" -o "public-${package_type}"
            printf '%s  %s\n' "$digest" "public-${package_type}" | sha256sum -c -
          done < public-artifacts.tsv
      - name: Prove clean public bootstrap install
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
        run: |
          simple_index_attempt=0
          while :; do
            simple_index_attempt=$((simple_index_attempt + 1))
            curl --fail --silent --show-error --location --max-time 20 \
              "https://pypi.org/simple/getcodexy/" -o simple-index.html
            if BOOTSTRAP_VERSION="$BOOTSTRAP_VERSION" python3 - simple-index.html <<'PY'
          import html.parser
          import os
          import sys
          from urllib.parse import unquote, urlsplit

          class DistributionLinks(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.filenames = set()

              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  href = dict(attrs).get("href")
                  if href:
                      filename = unquote(urlsplit(href).path.rsplit("/", 1)[-1])
                      if filename:
                          self.filenames.add(filename)

          version = os.environ["BOOTSTRAP_VERSION"]
          version_prefix = f"getcodexy-{version}"
          parser = DistributionLinks()
          with open(sys.argv[1], encoding="utf-8") as index:
              parser.feed(index.read())
          visible = sorted(
              filename
              for filename in parser.filenames
              if filename == f"{version_prefix}.tar.gz"
              or (filename.startswith(f"{version_prefix}-") and filename.endswith(".whl"))
          )
          if not visible:
              raise SystemExit(f"PyPI Simple Index does not expose getcodexy=={version} yet")
          print(f"PyPI Simple Index exposes getcodexy=={version}: {', '.join(visible)}")
          PY
            then
              break
            fi
            if test "$simple_index_attempt" -ge 12; then
              echo "PyPI Simple Index did not expose getcodexy==${BOOTSTRAP_VERSION} after ${simple_index_attempt} bounded checks; refusing exact-version install." >&2
              exit 1
            fi
            sleep 10
          done
          python -m venv public-bootstrap
          public-bootstrap/bin/python -m pip install --index-url https://pypi.org/simple "getcodexy==${BOOTSTRAP_VERSION}"
          public-bootstrap/bin/codexy-mcp-runtime --help
