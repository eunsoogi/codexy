name: Open verified runtime activation pull request

on:
  workflow_dispatch:
    inputs:
      bootstrap_version:
        description: "Publicly verified getcodexy bootstrap version"
        required: true
        type: string
      staging_run_id:
        description: "Successful authenticated runtime staging run"
        required: true
        type: string
      source_commit:
        description: "Exact source commit behind the staged archive"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  open-activation-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Prove public bootstrap and authenticated staging identity
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          curl --fail --location "https://pypi.org/pypi/getcodexy/${BOOTSTRAP_VERSION}/json" -o bootstrap.json
          test "$(jq -r .info.version bootstrap.json)" = "$BOOTSTRAP_VERSION"
          python -m venv public-bootstrap
          public-bootstrap/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple "getcodexy==${BOOTSTRAP_VERSION}"
          public-bootstrap/bin/codexy-mcp-runtime --help
          scripts/download-runtime-staging-artifact staging
          receipt=staging/runtime-staging-receipt.json
          test "$(jq -r .schema "$receipt")" = codexy-runtime-candidate-receipt/v1
          test "$(jq -r .candidate.source.commit "$receipt")" = "$SOURCE_COMMIT"
          test "$(jq -r .candidate.artifact.stagingRunId "$receipt")" = "$STAGING_RUN_ID"
          test "$(jq -r .candidate.artifact.stagingRunAttempt "$receipt")" = "$(jq -r .run_attempt staging/runtime-staging-run.json)"
          test "$(jq -r .provenance.runId "$receipt")" = "$STAGING_RUN_ID"
          test "$(jq -r .provenance.runAttempt "$receipt")" = "$(jq -r .run_attempt staging/runtime-staging-run.json)"
          jq -cS .provenance "$receipt" | tr -d '\n' > receipt-provenance.json
          jq -cS . staging/runtime-staging-provenance.json | tr -d '\n' > staged-provenance.json
          cmp receipt-provenance.json staged-provenance.json
          sha256sum staging/codexy-marketplace-plugin.tar.gz | grep "$(jq -r .artifact.sha256 "$receipt")"
          gh attestation verify staging/codexy-marketplace-plugin.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Prepare one version-selection branch
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codexy/runtime-activation-v${BOOTSTRAP_VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin main "$branch"
            git switch --track -c "$branch" "origin/$branch"
            scripts/verify-runtime-activation-branch "$branch" origin/main "$BOOTSTRAP_VERSION" "$GITHUB_WORKSPACE/staging/runtime-staging-receipt.json"
            printf '%s\n' existing > activation-branch-state
          else
            git switch -c "$branch"
            printf '%s\n' new > activation-branch-state
          fi
      - name: Apply verified activation and version-selection contract
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
        run: |
          scripts/activate-runtime-contract --repo-root "$GITHUB_WORKSPACE" --bootstrap-version "$BOOTSTRAP_VERSION" --candidate-receipt "$GITHUB_WORKSPACE/staging/runtime-staging-receipt.json"
          scripts/sync-plugin-version --version "$BOOTSTRAP_VERSION"
      - name: Create exactly one activation pull request
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codexy/runtime-activation-v${BOOTSTRAP_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/plugins plugins/codexy plugins/codexy-devtools packages/codexy-runtime/src/version/bootstrap.rs packages/codexy-runtime/Cargo.toml packages/codexy-runtime/Cargo.lock
          if test "$(cat activation-branch-state)" = existing; then
            git diff --cached --quiet || { echo "activation branch differs from verified contract" >&2; exit 1; }
          else
            git commit -m "feat(runtime): activate v${BOOTSTRAP_VERSION}"
            git push origin "$branch"
          fi
          test "$(gh pr list --head "$branch" --state open --json number --jq 'length')" -le 1
          if ! gh pr list --head "$branch" --state open --json number --jq 'length' | grep -Fqx 1; then
            {
              printf '%s\n' '## Summary' 'Select the verified staged Windows runtime and version 1.3.0.' '' '## Rationale' 'The runtime archive is bound to an authenticated successful Actions run.' '' '## Changed Areas' '- Runtime selection and version metadata' '' '## Verification' '- Bootstrap, staging identity, digest, provenance, and attestation checks' '' '## Evidence' '- Exact source and run-attempt binding' '' '## Not Run' '- None' '' '## Follow-ups' '- Final version publisher runs after merge.' '' 'Fixes #502'
            } > pr-body.md
            gh pr create --base main --head "$branch" --title "feat(runtime): activate v${BOOTSTRAP_VERSION}" --label type/feature --label type/ci --label status/review --label priority/high --label area/plugin --label area/release --label area/qa --body-file pr-body.md
          fi
