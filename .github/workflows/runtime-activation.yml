name: Open verified runtime activation pull request

on:
  workflow_dispatch:
    inputs:
      bootstrap_version:
        description: "Publicly verified getcodexy bootstrap version"
        required: true
        type: string
      staging_run_id:
        description: "Successful authenticated runtime staging run"
        required: true
        type: string
      source_commit:
        description: "Exact source commit behind the staged archive"
        required: true
        type: string

concurrency:
  group: codexy-runtime-activation-${{ inputs.bootstrap_version }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  open-activation-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build local candidate bootstrap and prove authenticated staging identity
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_at_admission="$(git rev-parse origin/main)"
          test "$GITHUB_SHA" = "$main_at_admission"
          test "$(git rev-parse HEAD)" = "$main_at_admission"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("packages/getcodexy/pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$(python3 -c 'import tomllib; print(next(package["version"] for package in tomllib.load(open("packages/getcodexy/uv.lock", "rb"))["package"] if package["name"] == "getcodexy"))')"
          test "$version" = "$BOOTSTRAP_VERSION"
          python -m pip install --disable-pip-version-check build
          python -m build --outdir "$RUNNER_TEMP/local-bootstrap-dist" packages/getcodexy
          python -m venv "$RUNNER_TEMP/local-bootstrap"
          "$RUNNER_TEMP/local-bootstrap/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/local-bootstrap-dist" "getcodexy==${BOOTSTRAP_VERSION}"
          "$RUNNER_TEMP/local-bootstrap/bin/codexy-mcp-runtime" --help
          staging_root="$RUNNER_TEMP/codexy-runtime-staging"
          scripts/download-runtime-staging-artifact "$staging_root"
          receipt="$staging_root/runtime-staging-receipt.json"
          test "$(jq -r .schema "$receipt")" = codexy-runtime-candidate-receipt/v1
          test "$(jq -r .candidate.source.commit "$receipt")" = "$SOURCE_COMMIT"
          jq -e '.candidate.source.tree | test("^[0-9a-f]{40}$")' "$receipt" >/dev/null
          test "$(jq -r .candidate.classes.coreHandoff.manifest.path "$receipt")" = handoff-runtime.json
          for platform in darwin-arm64 linux-x86_64 windows-x86_64; do
            extension=bin
            test "$platform" = windows-x86_64 && extension=exe
            test "$(jq -r --arg platform "$platform" '.candidate.classes.coreWatcherMcp.platforms[$platform].path' "$receipt")" = "runtime/codexy-mcp-watcher-$platform.$extension"
            jq -e --arg platform "$platform" '.candidate.classes.coreWatcherMcp.platforms[$platform].sha256 | test("^[0-9a-f]{64}$")' "$receipt" >/dev/null
          done
          test "$(jq -r .candidate.artifact.stagingRunId "$receipt")" = "$STAGING_RUN_ID"
          test "$(jq -r .candidate.artifact.stagingRunAttempt "$receipt")" = "$(jq -r .run_attempt "$staging_root/runtime-staging-run.json")"
          test "$(jq -r .provenance.runId "$receipt")" = "$STAGING_RUN_ID"
          test "$(jq -r .provenance.runAttempt "$receipt")" = "$(jq -r .run_attempt "$staging_root/runtime-staging-run.json")"
          jq -cS .provenance "$receipt" | tr -d '\n' > "$RUNNER_TEMP/receipt-provenance.json"
          jq -cS . "$staging_root/runtime-staging-provenance.json" | tr -d '\n' > "$RUNNER_TEMP/staged-provenance.json"
          cmp "$RUNNER_TEMP/receipt-provenance.json" "$RUNNER_TEMP/staged-provenance.json"
          sha256sum "$staging_root/codexy-marketplace-plugin.tar.gz" | grep "$(jq -r .artifact.sha256 "$receipt")"
          staged_plugin="$RUNNER_TEMP/codexy-runtime-staged-plugin"
          mkdir -p "$staged_plugin"
          tar -xzf "$staging_root/codexy-marketplace-plugin.tar.gz" -C "$staged_plugin"
          core="$staged_plugin/plugins/codexy-devtools"
          scripts/handoff_runtime_contract.py "$core/handoff-runtime.json" "$core"
          sha256sum "$core/handoff-runtime.json" | grep "$(jq -r .candidate.classes.coreHandoff.manifest.sha256 "$receipt")"
          gh attestation verify "$staging_root/codexy-marketplace-plugin.tar.gz" --repo "$GITHUB_REPOSITORY"
      - name: Prepare one version-selection branch
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codexy/runtime-activation-v${BOOTSTRAP_VERSION}"
          state_file="$RUNNER_TEMP/codexy-runtime-activation-state"
          trusted="$RUNNER_TEMP/codexy-runtime-contract"
          mkdir "$trusted"
          git archive "$GITHUB_SHA" | tar -x -C "$trusted"
          git merge-base --is-ancestor "$(jq -r .candidate.source.commit "$RUNNER_TEMP/codexy-runtime-staging/runtime-staging-receipt.json")" "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            existing_base="$(git merge-base "$GITHUB_SHA" "origin/$branch")"
            git merge-base --is-ancestor "$(jq -r .candidate.source.commit "$RUNNER_TEMP/codexy-runtime-staging/runtime-staging-receipt.json")" "$existing_base"
            git switch --track -c "$branch" "origin/$branch"
            "$trusted/scripts/verify-runtime-activation-branch" "$branch" "$existing_base" "$BOOTSTRAP_VERSION" "$RUNNER_TEMP/codexy-runtime-staging/runtime-staging-receipt.json"
            git merge --no-commit --no-ff "$GITHUB_SHA"
            printf '%s\n' existing > "$state_file"
          else
            git switch -c "$branch" "$GITHUB_SHA"
            printf '%s\n' new > "$state_file"
          fi
          git write-tree > "$RUNNER_TEMP/codexy-runtime-activation-tree"
      - name: Apply verified activation and version-selection contract
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
        run: |
          branch="codexy/runtime-activation-v${BOOTSTRAP_VERSION}"
          "$RUNNER_TEMP/codexy-runtime-contract/scripts/verify-runtime-activation-branch" --apply-from "$(cat "$RUNNER_TEMP/codexy-runtime-activation-tree")" "$branch" "$GITHUB_SHA" "$BOOTSTRAP_VERSION" "$RUNNER_TEMP/codexy-runtime-staging/runtime-staging-receipt.json"
      - name: Stage and verify activation branch
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
        run: |
          branch="codexy/runtime-activation-v${BOOTSTRAP_VERSION}"
          git add -A -- .
          "$RUNNER_TEMP/codexy-runtime-contract/scripts/verify-runtime-activation-branch" "$branch" "$GITHUB_SHA" "$BOOTSTRAP_VERSION" "$RUNNER_TEMP/codexy-runtime-staging/runtime-staging-receipt.json"
      - name: Create exactly one activation pull request
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codexy/runtime-activation-v${BOOTSTRAP_VERSION}"
          state_file="$RUNNER_TEMP/codexy-runtime-activation-state"
          test -f "$state_file"
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if ! git diff --cached --quiet || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "feat(runtime): activate v${BOOTSTRAP_VERSION}"
            git push origin "$branch"
          fi
          head_sha="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$head_sha"
          test "$(gh pr list --head "$branch" --state open --json number --jq 'length')" -le 1
          if ! gh pr list --head "$branch" --state open --json number --jq 'length' | grep -Fqx 1; then
            {
              printf '%s\n' '## Summary' "Select the verified staged Windows runtime and version ${BOOTSTRAP_VERSION}." '' '## Rationale' 'The runtime archive is bound to an authenticated successful Actions run.' '' '## Changed Areas' '- Runtime selection and version metadata' '' '## Verification' '- Bootstrap, staging identity, digest, provenance, and attestation checks' '' '## Evidence' '- Exact source and run-attempt binding' '' '## Not Run' '- None' '' '## Follow-ups' '- Final version publisher runs after merge; public publication retains governing-issue ownership.'
            } > "$RUNNER_TEMP/codexy-runtime-activation-pr.md"
            gh pr create --base main --head "$branch" --title "feat(runtime): activate v${BOOTSTRAP_VERSION}" --label type/feature --label type/ci --label status/review --label priority/high --label area/plugin --label area/release --label area/qa --body-file "$RUNNER_TEMP/codexy-runtime-activation-pr.md"
          fi
          pr_head="$(gh pr list --head "$branch" --state open --json headRefOid --jq '.[0].headRefOid')"
          test "$pr_head" = "$head_sha"
      - name: Dispatch required CI for exact activation head
        env:
          BOOTSTRAP_VERSION: ${{ inputs.bootstrap_version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="codexy/runtime-activation-v${BOOTSTRAP_VERSION}"
          head_sha="$(git rev-parse HEAD)"
          test "$(git ls-remote --exit-code origin "refs/heads/$branch" | cut -f1)" = "$head_sha"
          pr_number="$(gh pr list --repo "$GH_REPO" --head "$branch" --state open --json number --jq 'if length == 1 then .[0].number else empty end')"
          test -n "$pr_number"
          pr_head="$(gh pr view "$pr_number" --repo "$GH_REPO" --json headRefOid --jq .headRefOid)"
          base_sha="$(gh pr view "$pr_number" --repo "$GH_REPO" --json baseRefOid --jq .baseRefOid)"
          test "$pr_head" = "$head_sha"
          test "$base_sha" = "$(git rev-parse "$base_sha^{commit}")"
          changed_paths="$(gh api --paginate "repos/$GH_REPO/pulls/$pr_number/files?per_page=100" --jq '.[].filename')"
          plugin_needed=false
          python_needed=false
          while IFS= read -r path; do
            case "$path" in
              plugins/codexy/*|plugins/codexy-devtools/*|.codex/*|.agents/plugins/*|scripts/*|.github/workflows/plugin-runtime-binaries.yml) plugin_needed=true ;;
            esac
            case "$path" in
              packages/getcodexy/*|plugins/codexy/*|plugins/codexy-github/*|plugins/codexy-devtools/*|.agents/plugins/marketplace.json|docs/getcodexy-component-installation.md|.github/workflows/python-package.yml|.github/workflows/bootstrap-package.yml) python_needed=true ;;
            esac
          done <<< "$changed_paths"
          workflows=(rust-test.yml language-lint.yml touched-loc-gate.yml)
          $plugin_needed && workflows+=(plugin-runtime-binaries.yml)
          $python_needed && workflows+=(python-package.yml)
          report="$RUNNER_TEMP/codexy-runtime-activation-ci.tsv"
          printf 'workflow\trun_id\tevent\thead_sha\thead_branch\tstatus\tconclusion\n' > "$report"
          trap 'cat "$report"' EXIT
          workflow_runs() {
            gh run list --repo "$GH_REPO" --workflow "$1" --branch "$branch" --limit 100 --json databaseId,event,headSha,headBranch,status,conclusion,displayTitle
          }
          run_for_workflow() {
            local workflow="$1" runs run_id title="CI $head_sha"
            if test "$workflow" = touched-loc-gate.yml; then title="$title base $base_sha"; fi
            runs="$(workflow_runs "$workflow")"
            run_id="$(jq -r --arg sha "$head_sha" --arg branch "$branch" --arg title "$title" '[.[] | select(.headSha == $sha and .headBranch == $branch and .displayTitle == $title and (.event == "pull_request" or .event == "workflow_dispatch"))] | sort_by(.databaseId) | reverse | .[0].databaseId // empty' <<< "$runs")"
            if test -z "$run_id"; then
              case "$workflow" in
                rust-test.yml) gh workflow run "$workflow" --repo "$GH_REPO" --ref "$branch" -f head_sha="$head_sha" -f run_mode=ci -f condition=warm -f cache_mode=normal -f repeat_id=runtime-activation -f profiling=false -f cache_identity=runtime-activation ;;
                touched-loc-gate.yml) gh workflow run "$workflow" --repo "$GH_REPO" --ref "$branch" -f head_sha="$head_sha" -f base_sha="$base_sha" ;;
                *) gh workflow run "$workflow" --repo "$GH_REPO" --ref "$branch" -f head_sha="$head_sha" ;;
              esac
              for _ in $(seq 1 30); do
                runs="$(workflow_runs "$workflow")"
                run_id="$(jq -r --arg sha "$head_sha" --arg branch "$branch" --arg title "$title" '[.[] | select(.headSha == $sha and .headBranch == $branch and .displayTitle == $title and (.event == "pull_request" or .event == "workflow_dispatch"))] | sort_by(.databaseId) | reverse | .[0].databaseId // empty' <<< "$runs")"
                test -n "$run_id" && break
                sleep 5
              done
            fi
            test -n "$run_id"
            local run_json event actual_sha actual_branch status conclusion
            run_json="$(gh run view "$run_id" --repo "$GH_REPO" --json databaseId,event,headSha,headBranch,status,conclusion,displayTitle)"
            status="$(jq -r .status <<< "$run_json")"
            if test "$status" != completed; then
              if ! timeout 30m gh run watch "$run_id" --repo "$GH_REPO" --exit-status; then echo "$workflow run $run_id did not complete successfully" >&2; fi
            fi
            run_json="$(gh run view "$run_id" --repo "$GH_REPO" --json databaseId,event,headSha,headBranch,status,conclusion,displayTitle)"
            event="$(jq -r .event <<< "$run_json")"
            actual_sha="$(jq -r .headSha <<< "$run_json")"
            actual_branch="$(jq -r .headBranch <<< "$run_json")"
            status="$(jq -r .status <<< "$run_json")"
            conclusion="$(jq -r .conclusion <<< "$run_json")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$workflow" "$(jq -r .databaseId <<< "$run_json")" "$event" "$actual_sha" "$actual_branch" "$status" "$conclusion" >> "$report"
            test "$event" = pull_request || test "$event" = workflow_dispatch
            test "$actual_sha" = "$head_sha"
            test "$actual_branch" = "$branch"
            test "$(jq -r .displayTitle <<< "$run_json")" = "$title"
            test "$status" = completed
            test "$conclusion" = success
          }
          for workflow in "${workflows[@]}"; do run_for_workflow "$workflow"; done
          test "$(gh pr view "$pr_number" --repo "$GH_REPO" --json headRefOid --jq .headRefOid)" = "$head_sha"
          test "$(gh pr view "$pr_number" --repo "$GH_REPO" --json baseRefOid --jq .baseRefOid)" = "$base_sha"
