name: Publish verified version release

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Admitted MAJOR.MINOR.PATCH version from the activation contract"
        required: true
        type: string
      staging_source_commit:
        description: "Exact protected-main commit behind the staged artifact"
        required: true
        type: string
      activation_commit:
        description: "Exact later protected-main commit with activated version metadata"
        required: true
        type: string
      staging_run_id:
        description: "Successful authenticated runtime staging run"
        required: true
        type: string

concurrency:
  group: codexy-release-${{ inputs.target_version }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
jobs:
  publish-release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/getcodexy
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Admit protected PyPI environment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/admit-pypi-environment
      - name: Verify selected protected-main source
        env:
          STAGING_SOURCE_COMMIT: ${{ inputs.staging_source_commit }}
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
        run: |
          for commit in "$STAGING_SOURCE_COMMIT" "$ACTIVATION_COMMIT"; do
            case "$commit" in *[!0-9a-f]*|'') exit 1 ;; esac
            test "${#commit}" -eq 40
          done
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$STAGING_SOURCE_COMMIT" "$ACTIVATION_COMMIT"
          test "$STAGING_SOURCE_COMMIT" != "$ACTIVATION_COMMIT"
          git merge-base --is-ancestor "$ACTIVATION_COMMIT" origin/main
          test "$(git rev-parse "$STAGING_SOURCE_COMMIT")" = "$STAGING_SOURCE_COMMIT"
          test "$(git rev-parse "$ACTIVATION_COMMIT")" = "$ACTIVATION_COMMIT"
          test "$GITHUB_REF" = refs/heads/main
          git show "$GITHUB_SHA:scripts/project-release-verifiers.sh" > "$RUNNER_TEMP/project-release-verifiers" && chmod 755 "$RUNNER_TEMP/project-release-verifiers" && "$RUNNER_TEMP/project-release-verifiers" "$ACTIVATION_COMMIT"
      - name: Validate target version and release lifecycle contract
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          scripts/validate-release-lifecycle-contract "$TARGET_VERSION"
      - name: Download authenticated staging artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_COMMIT: ${{ inputs.staging_source_commit }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: scripts/download-runtime-staging-artifact staging
      - name: Verify selected archive identity
        env: { TARGET_VERSION: "${{ inputs.target_version }}", STAGING_SOURCE_COMMIT: "${{ inputs.staging_source_commit }}", ACTIVATION_COMMIT: "${{ inputs.activation_commit }}", STAGING_RUN_ID: "${{ inputs.staging_run_id }}" }
        run: |
          receipt=staging/runtime-staging-receipt.json
          test "$(git rev-parse HEAD)" = "$ACTIVATION_COMMIT"
          test "$(jq -r .candidate.source.commit "$receipt")" = "$STAGING_SOURCE_COMMIT"
          jq -e '(.candidate.source.tree | test("^[0-9a-f]{40}$")) and .candidate.classes.coreHandoff.manifest.path == "handoff-runtime.json"' "$receipt" >/dev/null
          test "$(jq -r .provenance.runId "$receipt")" = "$STAGING_RUN_ID"
          test "$(jq -r .candidate.artifact.stagingRunAttempt "$receipt")" = "$(jq -r .run_attempt staging/runtime-staging-run.json)"
          test "$(jq -r .provenance.runAttempt "$receipt")" = "$(jq -r .run_attempt staging/runtime-staging-run.json)"
          jq -cS .provenance "$receipt" | tr -d '\n' > receipt-provenance.json
          jq -cS . staging/runtime-staging-provenance.json | tr -d '\n' > staged-provenance.json
          cmp receipt-provenance.json staged-provenance.json
          sha256sum staging/codexy-marketplace-plugin.tar.gz | grep "$(jq -r .artifact.sha256 "$receipt")"; test "$(tar -xOzf staging/codexy-marketplace-plugin.tar.gz plugins/codexy-devtools/.codex-plugin/plugin.json | jq -er .version)" = "$TARGET_VERSION"
          record=.agents/plugins/runtime-activation.json
          test "$(jq -r .candidate.artifact.stagingRunId "$record")" = "$STAGING_RUN_ID"
          test "$(jq -r .candidate.source.commit "$record")" = "$STAGING_SOURCE_COMMIT"
          test "$(jq -r .artifact.sha256 "$record")" = "$(jq -r .artifact.sha256 "$receipt")"
          test "$(jq -r .candidate.classes.coreHandoff.manifest.sha256 "$record")" = "$(jq -r .candidate.classes.coreHandoff.manifest.sha256 "$receipt")"
          test ! -e plugins/codexy-devtools/runtime-candidate.json
      - name: Materialize and exercise activated final artifacts
        env:
          STAGING_SOURCE_COMMIT: ${{ inputs.staging_source_commit }}
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          mkdir -p dist final-inspect
          cp staging/codexy-marketplace-plugin.tar.gz dist/codexy-runtime-package.tar.gz
          RELEASE_TAG="$RELEASE_TAG" scripts/materialize-runtime-release-archive staging/codexy-marketplace-plugin.tar.gz dist/codexy-marketplace-plugin.tar.gz
          RELEASE_TAG="$RELEASE_TAG" scripts/assemble-release-train-archive.sh dist/codexy-marketplace-plugin.tar.gz dist/codexy-marketplace-bundle.tar.gz
          tar --no-same-owner --no-same-permissions -xzf dist/codexy-marketplace-plugin.tar.gz -C final-inspect
          scripts/inspect-release-archive dist/codexy-marketplace-plugin.tar.gz final-inspect/plugins/codexy-devtools public-release
          scripts/inspect_release_train_archive.py dist/codexy-marketplace-bundle.tar.gz "$PWD" "$RELEASE_TAG"
          scripts/create_release_train_receipt.py dist/codexy-marketplace-plugin.tar.gz dist/codexy-marketplace-bundle.tar.gz dist/codexy-runtime-package.tar.gz staging/runtime-staging-receipt.json staging/runtime-staging-run.json dist/runtime-release-receipt.json
      - name: Reconcile marketplace archive attestation
        env:
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/reconcile-release-attestations dist ATTEST_MARKETPLACE codexy-marketplace-plugin.tar.gz
      - name: Reconcile runtime archive attestation
        env:
          STAGING_SOURCE_COMMIT: ${{ inputs.staging_source_commit }}
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/reconcile-release-attestations dist ATTEST_RUNTIME codexy-runtime-package.tar.gz
      - name: Reconcile marketplace bundle attestation
        env:
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/reconcile-release-attestations dist ATTEST_BUNDLE codexy-marketplace-bundle.tar.gz
      - name: Reconcile release receipt attestation
        env:
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/reconcile-release-attestations dist ATTEST_RECEIPT runtime-release-receipt.json
      - name: Attest marketplace archive
        if: env.ATTEST_MARKETPLACE == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/codexy-marketplace-plugin.tar.gz
      - name: Attest runtime archive
        if: env.ATTEST_RUNTIME == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/codexy-runtime-package.tar.gz
      - name: Attest marketplace bundle
        if: env.ATTEST_BUNDLE == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/codexy-marketplace-bundle.tar.gz
      - name: Attest release receipt
        if: env.ATTEST_RECEIPT == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/runtime-release-receipt.json
      - name: Create and verify the only public version release
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SOURCE_COMMIT: ${{ inputs.staging_source_commit }}
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: scripts/publish-verified-release
      - name: Reconcile immutable release baseline attestation
        if: env.BASELINE_CREATED == 'true'
        env:
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/reconcile-release-attestations dist ATTEST_BASELINE release-baseline.json
      - name: Attest immutable release baseline
        if: env.BASELINE_CREATED == 'true' && env.ATTEST_BASELINE == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/release-baseline.json
      - name: Finalize authenticated public release
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
        run: scripts/finalize-verified-release

  verify-public-release:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.activation_commit }}
          persist-credentials: false
      - name: Download and verify reconciled public release without a token
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          TARGET_VERSION: ${{ inputs.target_version }}
          RELEASE_TAG: v${{ inputs.target_version }}
          STAGING_SOURCE_COMMIT: ${{ inputs.staging_source_commit }}
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main && git show "$GITHUB_SHA:scripts/project-release-verifiers.sh" > "$RUNNER_TEMP/project-release-verifiers" && chmod 755 "$RUNNER_TEMP/project-release-verifiers" && "$RUNNER_TEMP/project-release-verifiers" "$ACTIVATION_COMMIT"
          base="https://github.com/eunsoogi/codexy/releases/download/$RELEASE_TAG"
          curl --fail --location "$base/codexy-marketplace-plugin.tar.gz" -o public.tar.gz
          curl --fail --location "$base/codexy-marketplace-bundle.tar.gz" -o public-bundle.tar.gz
          curl --fail --location "$base/codexy-runtime-package.tar.gz" -o public-runtime.tar.gz
          curl --fail --location "$base/runtime-release-receipt.json" -o public-receipt.json
          curl --fail --location "$base/release-baseline.json" -o public-release-baseline.json
          sha256sum public.tar.gz | grep "$(jq -r .artifact.sha256 public-receipt.json)"
          sha256sum public-bundle.tar.gz | grep "$(jq -r .bundleArtifact.sha256 public-receipt.json)"
          sha256sum public-runtime.tar.gz | grep "$(jq -r .runtimeArtifact.sha256 public-receipt.json)"
          jq -e --arg commit "$STAGING_SOURCE_COMMIT" '.runtimeClasses.coreHandoff.source.commit == $commit and (.runtimeClasses.coreHandoff.source.tree | test("^[0-9a-f]{40}$")) and (.runtimeClasses.coreHandoff.sha256 | test("^[0-9a-f]{64}$"))' public-receipt.json >/dev/null
          test "$(jq -r .release.tag public-receipt.json)" = "$RELEASE_TAG"
          test "$(jq -r .source.activationCommit public-receipt.json)" = "$ACTIVATION_COMMIT"
          test "$(jq -r .source.stagingSourceCommit public-receipt.json)" = "$STAGING_SOURCE_COMMIT"
          mkdir -p public-inspect
          tar --no-same-owner --no-same-permissions -xzf public.tar.gz -C public-inspect
          scripts/inspect-release-archive public.tar.gz public-inspect/plugins/codexy-devtools public-release
          scripts/inspect_release_train_archive.py public-bundle.tar.gz "$PWD" "$RELEASE_TAG"
          test "$(jq -r .version public-inspect/plugins/codexy-devtools/.codex-plugin/plugin.json)" = "$TARGET_VERSION"; test "$(tar -xOzf public-runtime.tar.gz plugins/codexy-devtools/.codex-plugin/plugin.json | jq -er .version)" = "$TARGET_VERSION"
          test ! -e public-inspect/plugins/codexy-devtools/runtime-release.json
          test ! -e public-inspect/plugins/codexy-devtools/runtime-candidate.json
      - name: Verify public release attestations with a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ""
          STAGING_SOURCE_COMMIT: ${{ inputs.staging_source_commit }}
          ACTIVATION_COMMIT: ${{ inputs.activation_commit }}
        run: |
          mkdir public-attested
          cp public.tar.gz public-attested/codexy-marketplace-plugin.tar.gz
          cp public-bundle.tar.gz public-attested/codexy-marketplace-bundle.tar.gz
          cp public-runtime.tar.gz public-attested/codexy-runtime-package.tar.gz
          cp public-receipt.json public-attested/runtime-release-receipt.json
          cp public-release-baseline.json public-attested/release-baseline.json
          scripts/verify-release-attestation-set public-attested public-baseline-attestation.json baseline
          scripts/verify-release-attestation-set public-attested public-attestations.json
          jq -e --slurpfile baseline public-attested/release-baseline.json --slurpfile attestations public-attestations.json --arg receipt "$(sha256sum public-receipt.json | awk '{print $1}')" --arg signer "$GITHUB_REPOSITORY/.github/workflows/publish-version-release.yml" --arg runtimeSigner "$GITHUB_REPOSITORY/.github/workflows/runtime-candidate.yml" --arg activation "$ACTIVATION_COMMIT" --arg staging "$STAGING_SOURCE_COMMIT" '
            $baseline[0] as $expected | ($expected.releaseReceiptSha256 == $receipt) and
            ($expected.attestationPolicies == {"codexy-marketplace-plugin.tar.gz": {signerWorkflow: $signer, sourceRef: "refs/heads/main", sourceDigest: $activation, denySelfHostedRunners: true}, "codexy-marketplace-bundle.tar.gz": {signerWorkflow: $signer, sourceRef: "refs/heads/main", sourceDigest: $activation, denySelfHostedRunners: true}, "codexy-runtime-package.tar.gz": {signerWorkflow: $runtimeSigner, sourceRef: "refs/heads/main", sourceDigest: $staging, denySelfHostedRunners: true}, "runtime-release-receipt.json": {signerWorkflow: $signer, sourceRef: "refs/heads/main", sourceDigest: $activation, denySelfHostedRunners: true}}) and
            ($expected.attestations == $attestations[0])
          ' public-release-baseline.json >/dev/null
      - name: Smoke public release without a token
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          python -m venv public-bootstrap
          public-bootstrap/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple "getcodexy==${TARGET_VERSION}"
          CODEXY_RUNTIME_PLATFORM=linux-x86_64 public-bootstrap/bin/codexy-mcp-runtime lsp --plugin-root "$PWD/plugins/codexy-devtools" -- --help
          CODEXY_RUNTIME_PLATFORM=linux-x86_64 public-bootstrap/bin/codexy-mcp-runtime lsp --plugin-root "$PWD/public-inspect/plugins/codexy-devtools" -- --help
